<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#14706e">
    <link rel="icon" type="image/png" href="/brand/favicon.png">
    <title>FHU · Data Source Monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/monitor.css">
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div class="hero-brand">
          <img class="hero-logo" src="/brand/FHU-logo.png" alt="FHU — Felsburg Holt & Ullevig">
          <span class="hero-divider" aria-hidden="true"></span>
          <h1>Data Source Monitor</h1>
        </div>
        <button id="scan-now" class="primary" type="button">Scan Now</button>
      </header>

      <p class="scan-meta"><span>Last scan</span> <strong id="last-scan">Never</strong><strong id="run-status" role="status"></strong></p>

      <p id="announcement" class="announcement" role="status" aria-live="polite"></p>
      <section id="source-groups" aria-label="Configured sources"></section>
    </main>
    <script type="module" src="/monitor.js"></script>
  </body>
</html>
