<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Data Source Monitor</title>
    <link rel="stylesheet" href="/monitor.css">
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div>
          <h1>Data Source Monitor</h1>
        </div>
        <button id="scan-now" class="primary" type="button">Scan Now</button>
      </header>

      <p class="scan-meta"><span>Last scan</span> <strong id="last-scan">Never</strong><strong id="run-status" role="status"></strong></p>

      <p id="announcement" class="announcement" role="status" aria-live="polite"></p>
      <section id="source-groups" aria-label="Configured sources"></section>
    </main>
    <script type="module" src="/monitor.js"></script>
  </body>
</html>
